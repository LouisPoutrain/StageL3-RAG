[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stagel3-rag"
version = "1.0.0"
description = "Scientific RAG system for extracting and evaluating wildlife non-invasive DNA sampling protocols"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Louis Poutrain", email = "louispoutrain337@gmail.com" }
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "haystack",
    "hyde",
    "molecular-ecology",
    "non-invasive-sampling",
    "llm-as-a-judge",
    "nlp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "haystack-ai>=2.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "pypdf>=3.17.0",
    "lxml>=4.9.0",
    "nltk>=3.8.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "tiktoken>=0.5.0",
    "rapidfuzz>=3.0.0",
    "ecologits>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
stagel3-rag = "src.rag.mainRag:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "experiments*", "docs*"]
